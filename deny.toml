[advisories]
ignore = [
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.x via nsh (pinned 0.4.0); no in-tree fix" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser via nsh (pinned 0.4.0); no in-tree fix" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.85

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
