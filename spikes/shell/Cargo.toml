[package]
name = "spike-shell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "spike-shell"
path = "src/main.rs"

[dependencies]
spike-report = { path = "../report" }
spike-pdf = { path = "../pdf" }
spike-epub = { path = "../epub" }
nsh-core = "=0.4.0"
nsh-base = "=0.4.0"
nsh-platform-macos = { version = "=0.4.0", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = "=0.3.2"
objc2-foundation = "=0.3.2"
objc2-core-graphics = "=0.3.2"
objc2-core-foundation = "=0.3.2"
serde_json = "1"
block2 = "0.6"
