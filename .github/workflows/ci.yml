name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1
          rustup component add rustfmt --toolchain 1.98.1
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1
          rustup component add clippy --toolchain 1.98.1
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p spike-report --lib -- -D warnings

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 && rustup default 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p spike-report -p spike-epub --lib

  doc:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 && rustup default 1.98.1
      - uses: Swatinem/rust-cache@v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p spike-report -p spike-epub --no-deps

  deny:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1
        run: rustup toolchain install 1.98.1 && rustup default 1.98.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
