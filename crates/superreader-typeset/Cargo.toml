[package]
name = "superreader-typeset"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Headless EPUB chapter typesetter. WKWebView stays the reader until the gates pass."

[[bin]]
name = "typeset-pages"
path = "src/bin/pages.rs"

[dependencies]
harfrust = "0.15"
icu_segmenter = "2.4"
rbook = "=0.7.12"
read-fonts = "=0.46.0"
skrifa = "0.49"
tiny-skia = "0.12"

[[bin]]
name = "typeset-gate"
path = "src/bin/gate.rs"
